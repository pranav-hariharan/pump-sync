[project]
name = "pump-sync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pranav-hariharan", email = "pranavhariharan2007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.0",
]

[project.scripts]
pump-sync = "pump-sync:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
